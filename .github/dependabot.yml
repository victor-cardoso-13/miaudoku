# O GitHub avisa (e abre um pedido pronto) quando uma peça usada pelo jogo ganha versão com correção
# de segurança. Grátis. Você só precisa olhar os pedidos e dizer "pode seguir".
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      atualizacoes:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
