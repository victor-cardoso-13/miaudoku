# Publica o Miaudoku no GitHub Pages sempre que algo entra no "main".
# Antes de publicar, roda os testes: se algum falhar, o site NÃO é atualizado.
name: Publicar o Miaudoku

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Instalar, testar e montar
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: publicar
        uses: actions/deploy-pages@v4
